<!DOCTYPE html>

<html lang="en">

	<head>
		<title>JS</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	
	<body>
		<h1>Having fun with JS - log in screen</h1>
		
		<div id="mainScreen">
			<label>Your user name</label><br>
			<input onkeyup="validateData();" id="userName" type="text" /><br>
			<label>Your email address</label><br>
			<input onkeyup="validateData();" id="email" type="email" /><br>
			<label>Your password</label><br>
			<input onkeyup="validateData();" id="password" type="password" /><br>
			<button id="myBtn" onclick="authenticateUser();" disabled>Log in</button>
		</div>
		
		<div id="success">
			<p id="message"></p>
			<img src="images/thumbsup.jpg" alt="thumbs up"><br>
			<button onclick="logout();">Log out</button>
		</div>
		<script>
			document.getElementById("success").style.display = "none";
			var myTargetElementBtn = document.getElementById("myBtn");
			var sUserName, sEmail, sPassword;
			
			function validateData(){
				sUserName = document.getElementById("userName").value;
				sEmail = document.getElementById("email").value;
				sPassword = document.getElementById("password").value;
				
				//NOT = 0, false, "", undefined, null -> TRUE
				if(sUserName.length > 2 && sEmail.length > 2 && sPassword.length > 2){
					myTargetElementBtn.disabled = false;
				}else{
					myTargetElementBtn.disabled = true;
				}
			}
			
			function authenticateUser(){
				document.getElementById("mainScreen").style.display = "none";
				document.getElementById("success").style.display = "block";
				
				var sMessage = "You are now authenticated " + sUserName + ", your email address is " + sEmail + " and password " + sPassword + "!";
				document.getElementById("message").innerHTML = sMessage;			
			}
						
			function logout(){
				document.getElementById("mainScreen").style.display = "block";
				document.getElementById("success").style.display = "none";		
				document.getElementById("userName").value = "";
				document.getElementById("email").value = "";
				document.getElementById("password").value = "";
				myTargetElementBtn.disabled = true;
			}

		</script>				
	</body>

</html>
